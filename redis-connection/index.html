SSLConnection\n\n\nDEFAULT_PORT = 443\n\n\ndef _relax_strict_x509(config):\n    if os.environ.get(\"REDIS_SSL_STRICT\") == \"1\":\n        return\n    strict = getattr(ssl, \"VERIFY_X509_STRICT\", None)\n    supported = \"ssl_exclude_verify_flags\" in inspect.signature(SSLConnection.__init__).parameters\n    if strict is not None and supported:\n        config[\"ssl_exclude_verify_flags\"] = [strict]\n\n\ndef build_redis_client():\n    host = os.environ.get(\"REDIS_HOST\")\n    port = int(os.environ.get(\"REDIS_PORT\", str(DEFAULT_PORT)))\n    username = os.environ.get(\"REDIS_USERNAME\") or None\n    password = os.environ.get(\"REDIS_PASSWORD\")\n\n    # Certificates are optional and only used when explicitly provided.\n    ca_cert = os.environ.get(\"REDIS_CA_CERT\")\n    client_cert = os.environ.get(\"REDIS_CLIENT_CERT\")\n    client_key = os.environ.get(\"REDIS_CLIENT_KEY\")\n\n    config = {\n        \"host\": host,\n        \"port\": port,\n        \"decode_responses\": True,\n    }\n\n    if username:\n        config[\"username\"] = username\n    if password is not None:\n        config[\"password\"] = password\n\n    # Check if SSL should be enabled\n    use_ssl = os.environ.get(\"REDIS_USE_SSL\", \"\").lower() == \"1\"\n    certs_available = any(\n        value and os.path.exists(value) for value in (ca_cert, client_cert, client_key)\n    )\n\n    if use_ssl or certs_available:\n        config[\"ssl\"] = True\n        \n        # Only require client certs if they're actually provided\n        if certs_available:\n            config[\"ssl_cert_reqs\"] = \"required\"\n        else:\n            # Server-only verification (no client certs required)\n            config[\"ssl_cert_reqs\"] = \"none\"\n\n        for key, value in (\n            (\"ssl_ca_certs\", ca_cert),\n            (\"ssl_certfile\", client_cert),\n            (\"ssl_keyfile\", client_key),\n        ):\n            if value and os.path.exists(value):\n                config[key] = value\n\n        _relax_strict_x509(config)\n\n    return redis.Redis(**config)\n\n\ndef run_demo(client):\n    print(\n        f\"Pinging Redis at {client.connection_pool.connection_kwargs['host']}:{client.connection_pool.connection_kwargs['port']}...\"\n    )\n    print(client.ping())\n\n    key = \"demo_key\"\n    value = \"hello-from-python\"\n    client.set(key, value)\n    print(f\"SET {key}={value}\")\n    print(f\"GET {key} => {client.get(key)}\")\n\n\nif __name__ == \"__main__\":\n    try:\n        run_demo(build_redis_client())\n    except Exception as exc:  # pragma: no cover - runtime error should be visible to the user\n        print(f\"Connection failed: {exc}\")\n        raise SystemExit(1)\n"}], "null_word": "None"}}, "inputs": [["REDIS_HOST", "Yes", "(none)", "Hostname of the Redis database."], ["REDIS_PORT", "No", "443", "Port of the database."], ["REDIS_USERNAME", "No", "(none)", "ACL username, e.g. <code>default<\/code>. (The .NET example uses <code>default<\/code> if you leave it out.)"], ["REDIS_PASSWORD", "No", "(none)", "Database password. Can be read from the OpenShift secret."], ["REDIS_CA_CERT", "No", "(none)", "Path to the CA certificate. Supplying any certificate turns TLS on."], ["REDIS_CLIENT_CERT", "No", "(none)", "Path to the client certificate. Must be set together with <code>REDIS_CLIENT_KEY<\/code>."], ["REDIS_CLIENT_KEY", "No", "(none)", "Path to the client private key. Must be set together with <code>REDIS_CLIENT_CERT<\/code>."], ["REDIS_TLS / REDIS_USE_SSL", "No", "(auto)", "<code>REDIS_TLS=true|false<\/code> forces TLS on or off in the Java (Jedis) and .NET examples; <code>REDIS_USE_SSL=1<\/code> turns it on in the Python example. Lettuce enables TLS only when a certificate is supplied."]], "certs_note": "Certificates are optional. If your database requires TLS client certificates (mTLS), create a <code>certs/<\/code> folder next to the project and copy your files into it: the CA certificate (<code>ca.crt<\/code>), the client certificate (<code>client.crt<\/code>) and the client private key (<code>client.key<\/code>), then pass their paths in <code>REDIS_CA_CERT<\/code>, <code>REDIS_CLIENT_CERT<\/code> and <code>REDIS_CLIENT_KEY<\/code>. Without any certificate the example connects without TLS.", "troubleshooting": {"checklist": ["<strong>Read the first error line.<\/strong> It usually names the problem: a missing file, a certificate, a hostname, a timeout or authentication.", "<strong>Check the inputs.<\/strong> Echo <code>REDIS_HOST<\/code> and <code>REDIS_PORT<\/code> and confirm they point at the TLS port of your database.", "<strong>Check the files.<\/strong> All three exist, are readable, and are in PEM format (text starting with <code>-----BEGIN<\/code>).", "<strong>Check certificate dates.<\/strong> An expired or not-yet-valid certificate fails every time.", "<strong>Check the chain.<\/strong> The CA file must be the CA that signed the <em>server<\/em> certificate, and the client certificate must be signed by a CA the server trusts.", "<strong>Check the key.<\/strong> The private key must belong to the client certificate.", "<strong>Test outside the app<\/strong> with <code>openssl s_client<\/code> and <code>redis-cli<\/code> (commands below). If those fail too, the problem is the certificates, network or server, not your code.", "<strong>Check authentication last.<\/strong> Errors such as <code>WRONGPASS<\/code> or <code>NOAUTH<\/code> mean TLS already worked."], "general_errors": [["<code>REDIS_HOST must be set<\/code> / <code>Redis host is required<\/code> / <code>REDIS_CLIENT_CERT and REDIS_CLIENT_KEY must be set together<\/code>", "The examples no longer have a built-in host or certificate paths, and a client certificate needs its key (and the other way round).", "Set <code>REDIS_HOST<\/code> (and <code>REDIS_PORT<\/code> if it is not 443), and give <em>both<\/em> <code>REDIS_CLIENT_CERT<\/code> and <code>REDIS_CLIENT_KEY<\/code>, or neither."], ["Connection is closed or reset right away, protocol errors, or a timeout although the host and port are correct", "The database needs TLS but the example connected without it. TLS turns on only when you supply a certificate (or set <code>REDIS_TLS=true<\/code> / <code>REDIS_USE_SSL=1<\/code>).", "Supply the CA, client certificate and key, or set the TLS switch for your example. Lettuce needs at least one certificate."], ["Certificate file \"was not found\" / <code>No such file or directory<\/code> / <code>FileNotFoundException<\/code>", "Wrong working directory, or the file is not in <code>certs/<\/code>.", "Run from inside the example folder, check <code>ls -l certs/<\/code>, or set <code>REDIS_CA_CERT<\/code>, <code>REDIS_CLIENT_CERT<\/code> and <code>REDIS_CLIENT_KEY<\/code> to absolute paths."], ["<strong>Certificate invalid / expired:<\/strong> <code>certificate has expired<\/code>, <code>NotTimeValid<\/code>, <code>notAfter<\/code> in the past", "The server, client or CA certificate is past its end date (or its start date is in the future, or the machine clock is wrong).", "Run the <em>Check certificate dates<\/em> command below on all three files, and compare with <code>date<\/code>. Ask for a renewed certificate; fix the system clock if it is off."], ["<strong>Untrusted CA:<\/strong> <code>unable to get local issuer certificate<\/code>, <code>PKIX path building failed<\/code>, <code>UntrustedRoot<\/code>, <code>PartialChain<\/code>, <code>CERTIFICATE_VERIFY_FAILED<\/code>", "<code>ca.crt<\/code> is not the CA that signed the <em>server<\/em> certificate, or an intermediate CA is missing from the file.", "Run the live handshake test below. Get the correct CA from your Redis administrator. If there are intermediates, put the whole chain (intermediates, then root) in the CA file."], ["<strong>Hostname mismatch:<\/strong> <code>hostname mismatch<\/code>, <code>No subject alternative names matching<\/code>, <code>Hostname mismatch, certificate is not valid for<\/code>", "The host you connect to is not listed in the server certificate's Subject Alternative Names (for example you used an IP or an alias).", "Connect with a name listed in the certificate (see <em>Show the server certificate names<\/em> below), or ask for a certificate that includes your hostname."], ["Server rejects the client certificate: <code>bad certificate<\/code>, <code>unknown ca<\/code>, <code>certificate required<\/code>, <code>handshake failure<\/code>, connection reset right after connect", "The server does not trust the CA that signed <code>client.crt<\/code>, the client certificate is expired, or no client certificate was sent.", "Run <em>Check the client certificate against the CA<\/em>. Ask the Redis administrator which CA the database trusts for clients."], ["Private key problems: <code>key values mismatch<\/code>, <code>PEM lib<\/code>, <code>Could not read private key<\/code>, <code>InvalidKeySpecException<\/code>, <code>openssl pkcs12 failed<\/code>", "The key does not match the certificate, the file is not valid PEM, it is password-protected, or it is in the wrong format (Lettuce needs PKCS#8).", "Run <em>Check the key matches the certificate<\/em> and <em>Check the key format<\/em> below. Convert or decrypt the key if needed."], ["<code>wrong version number<\/code>, <code>packet length too long<\/code>, <code>SSL routines<\/code> error immediately", "You are connecting to a port that is not a TLS port (plain Redis port such as 6379).", "Use the database's TLS port (443 for an OpenShift route). Confirm <code>REDIS_PORT<\/code>."], ["Handshake closed or reset on port 443 with no certificate message", "The OpenShift route/ingress routes by SNI and the client did not send the right server name.", "Connect with the full route hostname (not an IP) so SNI is sent. Test with <code>openssl s_client -servername<\/code>."], ["<code>WRONGPASS<\/code>, <code>invalid username-password pair<\/code>, <code>NOAUTH Authentication required<\/code>, <code>AuthenticationError<\/code>", "TLS worked, but the username or password is wrong or missing.", "Check <code>REDIS_USERNAME<\/code> and <code>REDIS_PASSWORD<\/code>. Re-read the password from the secret and make sure there is no trailing newline or space."], ["Timeout / <code>Connection refused<\/code> / <code>Connect timed out<\/code> / <code>Timeout connecting to server<\/code>", "A firewall, VPN or network policy blocks the port, or the host/port is wrong.", "Run <code>nc -vz \"$REDIS_HOST\" \"$REDIS_PORT\"<\/code>. Check VPN, proxies and firewall rules."], ["<code>UnknownHostException<\/code>, <code>Name or service not known<\/code>, <code>nodename nor servname provided<\/code>", "The hostname does not resolve (typo, wrong DNS, VPN off).", "Run <code>nslookup \"$REDIS_HOST\"<\/code> and check the spelling and your DNS/VPN."]], "diagnostics": [["Set the variables once", "The commands below reuse the same environment variables as the examples. Run them from the example folder.", "export REDIS_HOST=\"your-db.example.com\"\nexport REDIS_PORT=\"443\"", "No output."], ["Check the files and the key format", "Confirms the files exist and shows what type of private key you have.", "ls -l certs/\nhead -1 certs/client.key", "<code>-----BEGIN PRIVATE KEY-----<\/code> = PKCS#8 (works everywhere). <code>-----BEGIN RSA PRIVATE KEY-----<\/code> or <code>BEGIN EC PRIVATE KEY<\/code> = traditional format (convert for Lettuce). <code>-----BEGIN ENCRYPTED PRIVATE KEY-----<\/code> = password-protected (decrypt first)."], ["Check certificate dates (is it expired?)", "Shows who the certificate belongs to, who issued it and when it is valid.", "openssl x509 -in certs/client.crt -noout -subject -issuer -dates\nopenssl x509 -in certs/ca.crt -noout -subject -issuer -dates\nopenssl x509 -in certs/client.crt -noout -checkend 0", "Today's date must be between <code>notBefore<\/code> and <code>notAfter<\/code>. The last command prints <code>Certificate will expire<\/code> if it has already expired."], ["Check the client certificate against the CA", "Verifies that <code>client.crt<\/code> was signed by <code>ca.crt<\/code>.", "openssl verify -CAfile certs/ca.crt certs/client.crt", "<code>certs/client.crt: OK<\/code>. Errors such as <code>unable to get local issuer certificate<\/code> or <code>certificate has expired<\/code> point to the cause. If your client certificate comes from a different CA than the server's, this check can fail even though the setup is fine - ask your administrator."], ["Check the key matches the certificate", "A certificate and key belong together only if their public keys are identical.", "openssl x509 -in certs/client.crt -noout -pubkey | openssl sha256\nopenssl pkey -in certs/client.key -pubout | openssl sha256", "Both lines must print the <strong>same<\/strong> hash. If they differ, you have the wrong key or the wrong certificate."], ["Test the live TLS handshake", "Connects to the server with your three files, exactly like the application does, without any Redis client code.", "openssl s_client -connect \"$REDIS_HOST:$REDIS_PORT\" -servername \"$REDIS_HOST\" \\\n  -CAfile certs/ca.crt -cert certs/client.crt -key certs/client.key \\\n  -verify_hostname \"$REDIS_HOST\" <\/dev/null", "Look for <code>Verify return code: 0 (ok)<\/code> near the end. Common failures: <code>20 unable to get local issuer certificate<\/code> (wrong CA), <code>10 certificate has expired<\/code>, <code>alert bad certificate<\/code> / <code>unknown ca<\/code> (server rejected the client certificate). <code>-verify_hostname<\/code> needs OpenSSL 1.1+; drop it if your version does not support it."], ["Show the server certificate names", "Lists the hostnames the server certificate is valid for and its dates.", "openssl s_client -connect \"$REDIS_HOST:$REDIS_PORT\" -servername \"$REDIS_HOST\" <\/dev/null 2>/dev/null \\\n  | openssl x509 -noout -subject -issuer -dates -text | grep -E \"Subject:|Issuer:|Not |DNS:\"", "Your <code>REDIS_HOST<\/code> must match one of the <code>DNS:<\/code> entries (a <code>*.example.com<\/code> wildcard covers one label only)."], ["Check the network", "Separates network and DNS problems from certificate problems.", "nslookup \"$REDIS_HOST\"\nnc -vz \"$REDIS_HOST\" \"$REDIS_PORT\"", "The name must resolve, and <code>nc<\/code> must report <code>succeeded<\/code> or <code>open<\/code>."], ["Test Redis outside your application", "If you have <code>redis-cli<\/code> 6.2+ this confirms TLS and login together. The password is passed via an environment variable so it stays out of your shell history.", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli -h \"$REDIS_HOST\" -p \"$REDIS_PORT\" --tls \\\n  --cacert certs/ca.crt --cert certs/client.crt --key certs/client.key \\\n  --sni \"$REDIS_HOST\" --user default PING", "<code>PONG<\/code>. If this works but the sample fails, the problem is in how the sample is run (paths, variables, key format). If this also fails, fix the certificates, network or credentials first."], ["Convert or decrypt the private key", "Use when the key is in the traditional format (Lettuce needs PKCS#8) or is password-protected.", "# convert to unencrypted PKCS#8\nopenssl pkcs8 -topk8 -nocrypt -in certs/client.key -out certs/client-pkcs8.key\n\n# remove a passphrase (you will be asked for it)\nopenssl pkey -in certs/client.key -out certs/client-decrypted.key\n\n# then point the example at the new file\nexport REDIS_CLIENT_KEY=\"certs/client-pkcs8.key\"", "Re-run the example. Keep the new key file protected (<code>chmod 600<\/code>) and delete the copies you do not need."]], "framework_errors": {"Jedis": [["<code>Client certificate was not found: /full/path<\/code> (or CA / key)", "The app looked in that exact absolute path and found nothing.", "Run <code>mvn exec:java<\/code> from the <code>Jedis<\/code> folder, or set the <code>REDIS_*<\/code> path variables."], ["<code>openssl pkcs12 failed with exit code ...<\/code>", "The app runs <code>openssl<\/code> to build a temporary keystore, and it failed: key and certificate do not match, key is encrypted, a file is not PEM, or <code>openssl<\/code> is not installed.", "Read the OpenSSL message printed under it, then run the key/certificate checks above and <code>openssl version<\/code>."], ["<code>No certificates were found in certs/ca.crt<\/code>", "The CA file is empty or not PEM.", "Open the file: it must contain <code>-----BEGIN CERTIFICATE-----<\/code>."], ["<code>javax.net.ssl.SSLHandshakeException: PKIX path building failed ... unable to find valid certification path<\/code>", "The server certificate is not signed by the CA you supplied.", "Use the correct CA file; include intermediates."], ["<code>SSLHandshakeException: No subject alternative names matching ...<\/code>", "Hostname is not in the server certificate.", "Use a hostname listed in the certificate."], ["<code>Received fatal alert: bad_certificate<\/code> or <code>certificate_unknown<\/code>", "The server rejected your client certificate.", "Check the client certificate against the CA and its dates."], ["<code>JedisConnectionException<\/code> with <code>Connect timed out<\/code> or <code>Read timed out<\/code>", "Network blocked, or wrong host/port. The sample uses 5-second timeouts.", "Run the network checks above."], ["<code>JedisAccessControlException<\/code> / <code>WRONGPASS<\/code> / <code>NOAUTH<\/code>", "Wrong or missing username/password.", "Check <code>REDIS_USERNAME<\/code> and <code>REDIS_PASSWORD<\/code>."], ["<code>release version 17 not supported<\/code> or <code>UnsupportedClassVersionError<\/code>", "Java older than 17.", "Run <code>java -version<\/code> and <code>mvn -version<\/code>; install JDK 17+ and point <code>JAVA_HOME<\/code> to it."], ["<code>Invalid REDIS_PORT<\/code> / <code>NumberFormatException<\/code>", "The port is not a number.", "Use digits only, for example <code>443<\/code>."]], "Lettuce": [["<code>RedisConnectionException: Unable to connect to host:443<\/code>", "Generic wrapper. The real reason is in the <code>Caused by:<\/code> lines below it.", "Scroll to the cause: a <code>SSLHandshakeException<\/code> means certificates, a timeout means network."], ["<code>Caused by: ... PKIX path building failed<\/code> / <code>unable to find valid certification path<\/code>", "Server certificate not signed by the supplied CA.", "Use the correct CA file; include intermediates."], ["<code>InvalidKeySpecException<\/code>, <code>algid parse error<\/code>, <code>Could not read private key<\/code>, <code>IllegalArgumentException: ... PKCS8<\/code>", "Lettuce needs an unencrypted <strong>PKCS#8<\/strong> key; yours is in the traditional (<code>BEGIN RSA PRIVATE KEY<\/code>) format or encrypted.", "Convert it: <code>openssl pkcs8 -topk8 -nocrypt -in certs/client.key -out certs/client-pkcs8.key<\/code> and set <code>REDIS_CLIENT_KEY<\/code>."], ["<code>RedisCommandTimeoutException: Command timed out after 10 second(s)<\/code>", "Connection opened but the command did not complete in the sample's 10-second timeout.", "Check network latency, firewall and server load."], ["<code>RedisCommandExecutionException: WRONGPASS<\/code> or <code>NOAUTH<\/code>", "Wrong or missing credentials.", "Check <code>REDIS_USERNAME<\/code> and <code>REDIS_PASSWORD<\/code>. The sample sends a username only if <code>REDIS_USERNAME<\/code> is set."], ["<code>java.net.UnknownHostException<\/code>", "Hostname does not resolve.", "Check <code>REDIS_HOST<\/code>, DNS and VPN."], ["<code>release version 17 not supported<\/code>", "Java older than 17.", "Install JDK 17+ and check <code>mvn -version<\/code>."]], "StackExchange": [["<code>TLS validation failed: the server certificate was not signed by the configured CA.<\/code> followed by lines like <code>UntrustedRoot<\/code>, <code>PartialChain<\/code>, <code>NotTimeValid<\/code>", "The sample validates the server against your CA file and prints the chain status. These lines tell you why.", "<code>UntrustedRoot<\/code>/<code>PartialChain<\/code> = wrong or incomplete CA. <code>NotTimeValid<\/code> = expired. Use the diagnostics below."], ["<code>TLS validation failed: server certificate hostname mismatch.<\/code>", "<code>REDIS_HOST<\/code> is not in the server certificate.", "Use a hostname listed in the certificate."], ["<code>TLS validation failed: the server did not provide a certificate.<\/code> / <code>server certificate is unavailable.<\/code>", "The connection was not a real TLS session (wrong port or a proxy).", "Confirm the TLS port and test with <code>openssl s_client<\/code>."], ["<code>Redis connection failed: It was not possible to connect to the redis server(s)<\/code>", "General connection failure. The messages printed just above it say whether it was TLS, network or authentication.", "Read the lines above, then use the checklist."], ["<code>Client certificate was not found.<\/code> (<code>FileNotFoundException<\/code>, with the full path)", "The file is not at that absolute path.", "Run <code>dotnet run<\/code> from the <code>StackExchange<\/code> folder or set the path variables."], ["<code>openssl pkcs12 failed<\/code> / an <code>InvalidOperationException<\/code> mentioning OpenSSL, or <code>Win32Exception<\/code>", "OpenSSL is missing from <code>PATH<\/code>, or it could not combine your key and certificate (mismatch, encrypted key, not PEM).", "Run <code>openssl version<\/code>, then the key and certificate checks."], ["<code>No certificates were found in ...<\/code>", "The CA file is empty or not PEM.", "It must contain <code>-----BEGIN CERTIFICATE-----<\/code>."], ["<code>WRONGPASS<\/code> / <code>NOAUTH<\/code> (<code>RedisServerException<\/code>)", "Wrong or missing credentials.", "Check <code>REDIS_USERNAME<\/code> and <code>REDIS_PASSWORD<\/code>."], ["<code>Timeout performing PING<\/code>", "Connected but the server did not answer within 5 seconds.", "Check network latency and server load."], ["<code>Invalid REDIS_PORT value<\/code>", "The port is not a number.", "Use digits only, for example <code>443<\/code>."], ["<code>The framework 'Microsoft.NETCore.App', version '7.0.0' was not found<\/code>", ".NET 7 runtime is not installed.", "Run <code>dotnet --list-sdks<\/code> and install .NET SDK 7.0 or later."]], "Python": [["<code>Connection failed: [SSL: CERTIFICATE_VERIFY_FAILED] ... unable to get local issuer certificate<\/code>", "The CA file is not the one that signed the server certificate (the sample requires verification).", "Use the correct CA; include intermediates."], ["<code>CERTIFICATE_VERIFY_FAILED ... CA cert does not include key usage extension<\/code> (works with Java/.NET, or with an older Python)", "Python 3.13 and later check certificates strictly, and your CA certificate has no Key Usage extension. Older Python versions, Java and .NET do not check this.", "The sample now relaxes this check by default (set <code>REDIS_SSL_STRICT=1<\/code> to enforce it). The proper fix is to re-issue the CA with <code>keyUsage = keyCertSign, cRLSign<\/code>. Check yours with <code>openssl x509 -in certs/ca.crt -noout -text | grep -A1 \"Key Usage\"<\/code>."], ["<code>CERTIFICATE_VERIFY_FAILED ... certificate has expired<\/code>", "A certificate in the chain has expired.", "Run the date checks."], ["<code>CERTIFICATE_VERIFY_FAILED ... Hostname mismatch, certificate is not valid for '...'<\/code>", "<code>REDIS_HOST<\/code> is not in the server certificate.", "Use a hostname listed in the certificate."], ["<code>ssl.SSLError: [SSL] PEM lib<\/code> or <code>key values mismatch<\/code>", "<code>client.key<\/code> does not match <code>client.crt<\/code>, or one of them is not valid PEM.", "Run the key/certificate match check."], ["<code>[SSL: TLSV1_ALERT_UNKNOWN_CA]<\/code> or <code>SSLV3_ALERT_BAD_CERTIFICATE<\/code>", "The server rejected your client certificate.", "Check the client certificate's CA and dates."], ["<code>FileNotFoundError: [Errno 2] No such file or directory<\/code>", "A certificate path is wrong. Default paths are relative to <code>python_conn.py<\/code>.", "Check <code>certs/<\/code> next to the script or set the path variables."], ["<code>ModuleNotFoundError: No module named 'redis'<\/code>", "The virtual environment is not active or the package is not installed.", "<code>source .venv/bin/activate<\/code> then <code>python -m pip install redis<\/code>."], ["<code>Connection failed: WRONGPASS invalid username-password pair<\/code> / <code>Authentication required.<\/code>", "Wrong or missing credentials.", "Check <code>REDIS_USERNAME<\/code> and <code>REDIS_PASSWORD<\/code>."], ["<code>Connection failed: Timeout connecting to server<\/code> / <code>Connection refused<\/code>", "Network blocked or wrong host/port.", "Run the network checks."], ["<code>Error ... connecting to host:443. nodename nor servname provided<\/code> (or <code>Name or service not known<\/code>)", "Hostname does not resolve.", "Check <code>REDIS_HOST<\/code>, DNS and VPN."], ["<code>ValueError: invalid literal for int()<\/code>", "<code>REDIS_PORT<\/code> is not a number.", "Use digits only, for example <code>443<\/code>."]]}}};

const $ = (s, r = document) => r.querySelector(s);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function codeBlock(text, label) {
  const w = document.createElement("div");
  w.className = "codewrap";
  w.innerHTML = `<div class="bar"><span>${esc(label || "")}</span><button type="button" class="copy">Copy</button></div><pre><code></code></pre>`;
  w._text = text;
  w.setText = v => { w._text = v; $("code", w).textContent = v; };
  $("code", w).textContent = text;
  $(".copy", w).addEventListener("click", async e => {
    try { await navigator.clipboard.writeText(w._text); e.target.textContent = "Copied!"; }
    catch { const r = document.createRange(); r.selectNodeContents($("code", w)); getSelection().removeAllRanges(); getSelection().addRange(r); e.target.textContent = "Selected - press Ctrl/Cmd+C"; }
    setTimeout(() => e.target.textContent = "Copy", 1800);
  });
  return w;
}

function step(n, title, ...nodes) {
  const s = document.createElement("section");
  s.className = "step";
  s.innerHTML = `<h2><span class="num">${n}</span>${title}</h2>`;
  nodes.forEach(x => s.append(typeof x === "string" ? Object.assign(document.createElement("div"), { innerHTML: x }) : x));
  return s;
}

// Run commands that follow the host / port / username typed in the connection form.
const DEFAULT_HOST = "demo-db.redis-enterprise.example.com";
const liveBlocks = [];
const shq = v => v.replace(/[\\"$`]/g, "\\$&");
function connLines() {
  const host = form.host.trim() || DEFAULT_HOST, port = String(form.port).trim() || "443", user = form.username.trim();
  return `REDIS_HOST="${shq(host)}" \\\n` + `REDIS_PORT="${shq(port)}" \\\n` + (user ? `REDIS_USERNAME="${shq(user)}" \\\n` : "");
}
function liveBlock(template, label) {
  const b = codeBlock("", label);
  const update = () => b.setText(template.replace("@@CONN@@", connLines()));
  liveBlocks.push(update); update();
  return b;
}
const refreshCommands = () => liveBlocks.forEach(u => u());

const form = { host: "", port: "443", username: "default", password: "", ca_cert: "", client_cert: "", client_key: "" };
const server = { ok: false, timeout: 60 };

function applyServerState() {
  document.querySelectorAll(".test-btn").forEach(b => b.disabled = !server.ok);
  document.querySelectorAll(".server-note").forEach(n => { n.hidden = server.ok; });
}

function testPanel(key, f) {
  const nw = f.null_word;
  const root = document.createElement("div");
  const text = (id, env, label, type, ph, help) => `<div class="field"><label for="in-${id}">${label} <code>${env}</code></label><input id="in-${id}" type="${type}" placeholder="${esc(ph)}" autocomplete="${type === "password" ? "new-password" : "off"}" spellcheck="false"><span class="help">${help}</span></div>`;
  const pem = (id, env, label, file) => `<div class="field wide"><label for="in-${id}">${label} <code>${env}</code></label><textarea id="in-${id}" rows="4" spellcheck="false" placeholder="-----BEGIN ...-----&#10;Paste the contents of ${file}, or choose the file"></textarea><span class="row"><button type="button" class="btn small" data-file="${id}">Choose ${file}&hellip;</button><input type="file" hidden data-input="${id}" accept=".crt,.pem,.cer,.key,.txt"><span class="help">Optional. PEM text, used only for this test.</span></span></div>`;
  root.innerHTML = `
    <p>Fill in the values below and press <strong>Test Connection</strong>. Only the host is required: leave all three certificate boxes empty to connect without TLS, or fill them in for mutual TLS (the client certificate and key go together). The ${esc(f.label)} example runs on the server with these settings and its output appears underneath.</p>
    <div class="form">
      ${text("host", "REDIS_HOST", "Redis host", "text", "your-db.example.com", "Required.")}
      ${text("port", "REDIS_PORT", "Port", "number", "443", "Default is 443.")}
      ${text("username", "REDIS_USERNAME", "Username", "text", nw, `Default is <code>default</code>. Clear it to use no username (${nw}).`)}
      <div class="field"><label for="in-password">Password <code>REDIS_PASSWORD</code></label><input id="in-password" type="password" placeholder="${nw}" autocomplete="new-password" spellcheck="false"><span class="help">Leave empty if the database has no password (<code>${nw}</code> in ${esc(f.label.replace(/ \(.*/, ""))}). <label class="showpw"><input type="checkbox" id="showpw"> Show</label></span></div>
      ${pem("ca_cert", "REDIS_CA_CERT", "CA certificate", "ca.crt")}
      ${pem("client_cert", "REDIS_CLIENT_CERT", "Client certificate", "client.crt")}
      ${pem("client_key", "REDIS_CLIENT_KEY", "Client private key", "client.key")}
    </div>
    <div class="note server-note" hidden>Test Connection only works when this page is served by the container (for example <code>http://localhost:8080</code>). You opened it as a plain file, so the button is disabled.</div>
    <div class="actions"><button type="button" class="btn primary test-btn" disabled>Test Connection</button><button type="button" class="btn clear-btn" title="Empty every field and the output">Clear</button><span class="badge wait" id="badge" role="status" aria-live="polite" hidden></span></div>
    <pre class="out nobar" id="out" tabindex="0" aria-label="Test output" hidden></pre>
    <p class="hint">Your password and certificates are sent only to this server, written to a temporary folder for the single test, and deleted straight afterwards. They are never stored.${location.protocol === "http:" && !["localhost", "127.0.0.1"].includes(location.hostname) ? " <strong>This page is not using HTTPS - do not enter real credentials.</strong>" : ""}</p>`;

  // restore values kept from a previous framework choice
  Object.keys(form).forEach(id => { $("#in-" + id, root).value = form[id]; });
  root.querySelectorAll("input[id^=in-], textarea").forEach(el => el.addEventListener("input", () => { form[el.id.slice(3)] = el.value; refreshCommands(); }));
  $("#showpw", root).addEventListener("change", e => { $("#in-password", root).type = e.target.checked ? "text" : "password"; });
  root.querySelectorAll("[data-file]").forEach(btn => {
    const id = btn.dataset.file, input = $(`[data-input=${id}]`, root);
    btn.addEventListener("click", () => input.click());
    input.addEventListener("change", () => {
      const file = input.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = () => { $("#in-" + id, root).value = form[id] = String(r.result); };
      r.readAsText(file);
    });
  });

  const badge = $("#badge", root), out = $("#out", root), btn = $(".test-btn", root);
  const show = (cls, label, body) => {
    badge.hidden = false; badge.className = "badge " + cls; badge.textContent = label;
    out.hidden = false; out.textContent = body; out.scrollTop = 0;
  };
  btn.addEventListener("click", async () => {
    const missing = [];
    if (!form.host.trim()) missing.push("REDIS_HOST");
    if (missing.length) { show("fail", "Missing input", "Please provide: " + missing.join(", ")); return; }
    if (!form.client_cert.trim() !== !form.client_key.trim()) { show("fail", "Missing input", "REDIS_CLIENT_CERT and REDIS_CLIENT_KEY must be provided together."); return; }
    btn.disabled = true;
    show("wait", "Testing\u2026", `Running the ${f.label} example against ${form.host.trim()}:${form.port || 443} (up to ${server.timeout} s)...`);
    try {
      const res = await fetch("api/test", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ framework: key, ...form }) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) show("fail", "Request rejected", data.error || `The server answered HTTP ${res.status}.`);
      else show(data.ok ? "pass" : "fail", data.ok ? "Connection successful" : (data.timed_out ? "Timed out" : "Connection failed"),
        `$ ${data.command}\n\n${data.output.trim() || "(no output)"}\n\n[exit code ${data.exit_code} - ${data.duration_s} s]`);
    } catch (err) {
      show("fail", "Server unreachable", "Could not reach the test server: " + err.message);
    } finally { btn.disabled = !server.ok; }
  });
  $(".clear-btn", root).addEventListener("click", () => {
    Object.keys(form).forEach(id => { form[id] = ""; $("#in-" + id, root).value = ""; });
    root.querySelectorAll("input[type=file]").forEach(i => { i.value = ""; });
    badge.hidden = true; badge.textContent = ""; out.hidden = true; out.textContent = "";
    refreshCommands();
    $("#in-host", root).focus();
  });
  return root;
}

function render(key) {
  const c = $("#content");
  c.innerHTML = "";
  $("#summary").textContent = "";
  if (!key) { c.innerHTML = '<p class="empty">Select a framework from the dropdown above to get started.</p>'; return; }
  const f = DATA.frameworks[key];
  $("#summary").textContent = f.summary;

  liveBlocks.length = 0;
  let n = 0;

  // 1. Inputs + Test Connection
  const rows = DATA.inputs.map(r => `<tr><td><code>${r[0]}</code></td><td>${r[1]}</td><td>${r[2] === "(none)" ? "&mdash;" : "<code>" + esc(r[2]) + "</code>"}</td><td>${r[3]}</td></tr>`).join("");
  c.append(step(++n, "Enter your connection details and test", testPanel(key, f),
    `<details><summary>Command-line reference: the same settings as environment variables</summary><p>When you run the code yourself (the Build and Run steps below) the program reads these environment variables - nothing is typed in interactively.</p><div class="tablewrap"><table><thead><tr><th>Variable</th><th>Required</th><th>Default</th><th>Meaning</th></tr></thead><tbody>${rows}</tbody></table></div><p class="hint">* The built-in default host is a placeholder - set <code>REDIS_HOST</code> to your own database host.</p></details>`));

  // 2. Prerequisites
  c.append(step(++n, "Install the prerequisites",
    "<ul>" + f.prereqs.map(([t, cmd]) => `<li>${esc(t)}${cmd ? ` &mdash; check with <code>${esc(cmd)}</code>` : ""}</li>`).join("") + "</ul>"));

  // 3. Directory
  c.append(step(++n, "Set up the directory",
    `<p>Use the <code>${esc(f.folder)}</code> folder from this project. Its layout must look like this:</p>`,
    codeBlock(f.layout, "Directory layout"),
    `<p>${DATA.certs_note}</p>`,
    `<p>Then go to the project and prepare it:</p>`,
    codeBlock(f.setup_cmd, "bash"),
    ...f.notes.map(n => `<div class="note">${n}</div>`)));

  // 4. Build
  const build = [`<p>Run this inside the project folder:</p>`, codeBlock(f.build_cmd, "bash")];
  if (f.build_ok) build.push(`<p>A successful build ends with <span class="ok">${esc(f.build_ok)}</span></p>`);
  c.append(step(++n, esc(f.build_title), ...build));

  // 5. Run
  c.append(step(++n, "Run it",
    "<h3>Option A &mdash; read the password from the OpenShift secret</h3>",
    liveBlock(f.run_secret, "bash"),
    "<h3>Option B &mdash; type the password directly</h3>",
    liveBlock(f.run_direct, "bash"),
    "<h3>Option C &mdash; certificates stored somewhere else</h3>",
    liveBlock(f.run_override, "bash"),
    `<p class="hint">The host, port and username in these commands follow what you entered in step 1 (an empty username is left out). Replace the password and certificate paths with your own.</p>`));

  // 6. Output
  c.append(step(++n, "Expected output",
    "<p>If the connection works you will see something like:</p>",
    codeBlock(f.output, "output"),
    `<p class="hint">If you see a TLS or authentication error instead, check the host, port, password and the three files in <code>certs/</code>.</p>`));

  // 7. Source
  const src = document.createElement("section");
  src.className = "step";
  src.innerHTML = `<h2><span class="num">${++n}</span>Complete source code</h2>`;
  const tabs = document.createElement("div"); tabs.className = "tabs"; tabs.setAttribute("role", "tablist");
  const holder = document.createElement("div");
  f.files.forEach((file, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "tab"; b.textContent = file.name; b.setAttribute("role", "tab");
    b.addEventListener("click", () => show(i));
    tabs.append(b);
  });
  function show(i) {
    [...tabs.children].forEach((b, j) => b.setAttribute("aria-selected", j === i));
    holder.innerHTML = "";
    holder.append(codeBlock(f.files[i].code, f.files[i].path));
  }
  src.append(tabs, holder);
  c.append(src);
  show(f.files.length - 1);

  // 8. Troubleshooting
  const T = DATA.troubleshooting;
  const errTable = rows => `<div class="tablewrap"><table><thead><tr><th>What you see</th><th>Likely cause</th><th>What to do</th></tr></thead><tbody>${rows.map(r => `<tr><td class="sym">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</tbody></table></div>`;
  const diag = document.createElement("div");
  T.diagnostics.forEach(([title, why, cmd, look]) => {
    const d = document.createElement("details");
    d.innerHTML = `<summary>${title}</summary><p>${why}</p>`;
    d.append(codeBlock(cmd, "bash"));
    d.insertAdjacentHTML("beforeend", `<p class="hint"><strong>What to look for:</strong> ${look}</p>`);
    diag.append(d);
  });
  c.append(step(++n, "Troubleshooting",
    "<p>If the example does not print the expected output, work through these in order.</p>",
    `<h3>Step-by-step approach</h3><ol class="check">${T.checklist.map(x => `<li>${x}</li>`).join("")}</ol>`,
    `<h3>Common errors with ${esc(f.label)}</h3>`, errTable(T.framework_errors[key]),
    "<h3>Certificate, TLS and connection errors (all frameworks)</h3>", errTable(T.general_errors),
    "<h3>Diagnostic commands</h3><p class=\"hint\">Run these from the example folder. They test the certificates and connection without any Redis client code. Click a title to expand it.</p>", diag));
  applyServerState();
}

fetch("api/health").then(r => r.ok ? r.json() : Promise.reject()).then(j => { server.ok = true; server.timeout = j.timeout_s || 60; }).catch(() => { server.ok = false; }).finally(applyServerState);

const sel = $("#fw");
Object.entries(DATA.frameworks).forEach(([k, f]) => sel.add(new Option(f.label, k)));
sel.addEventListener("change", () => { history.replaceState(null, "", sel.value ? "#" + sel.value : location.pathname); render(sel.value); });
const initial = location.hash.slice(1);
if (DATA.frameworks[initial]) { sel.value = initial; render(initial); }
</script>
</body>
</html>
